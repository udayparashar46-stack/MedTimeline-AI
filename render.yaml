services:
  - type: web
    name: medtimeline-ai-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: "cd frontend && npm ci && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://medtimeline-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: medtimeline-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: AUTH_REQUIRED
        value: "true"
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: medtimeline-db
    plan: free
