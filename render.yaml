services:
  - type: web
    name: medtimeline-ai-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: "cd frontend && npm ci && npm run build && cd .. && pip install -r backend/requirements.txt && cd backend && python -c \"import app.services.extraction.ocr.engine as e; print('Tessdata ready at:', e.get_tessdata_dir())\""
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://medtimeline-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: medtimeline-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: STORAGE_BACKEND
        value: local
      - key: OCR_ENABLED
        value: "true"
      - key: AUTH_REQUIRED
        value: "true"

databases:
  - name: medtimeline-db
    plan: free
